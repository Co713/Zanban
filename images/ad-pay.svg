    <text x="36" y="128" fill="#2a5f58" font-family="system-ui,sans-serif" font-size="56" font-weight="300">02</text>
    <rect x="280" y="96" width="100" height="36" rx="2" fill="#c4964a" fill-opacity="0.9"/>
  </g>

  <!-- bonus coin / gift mark -->
  <g transform="translate(560 760)">
    <circle cx="90" cy="90" r="90" fill="url(#gold)"/>
    <circle cx="90" cy="90" r="68" fill="none" stroke="#f4f6f1" stroke-opacity="0.35" stroke-width="3"/>
    <path d="M60 98h60M90 68v60" stroke="#f4f6f1" stroke-width="6" stroke-linecap="round"/>
    <text x="90" y="210" text-anchor="middle" fill="#2a5f58" font-family="system-ui,sans-serif" font-size="22" letter-spacing="0.2em" opacity="0.55">�</text>
  </g>

  <circle cx="140" cy="860" r="10" fill="#2a5f58" opacity="0.2"/>
  <circle cx="780" cy="220" r="7" fill="#c4964a" opacity="0.55"/>
