<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" fill="none" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="og" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f6358"/>
      <stop offset="100%" stop-color="#6d8274"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1100" fill="url(#og)"/>

  <!-- pooling rings -->
  <g transform="translate(450 460)" fill="none" stroke="#e8efe6" stroke-linecap="round">
    <circle r="300" stroke-opacity="0.08" stroke-width="2"/>
    <circle r="220" stroke-opacity="0.14" stroke-width="2"/>
    <circle r="140" stroke-opacity="0.22" stroke-width="2.5"/>
  </g>

  <!-- three abstract seats merging -->
  <g transform="translate(450 430)">
    <g transform="translate(-160 -20)">
      <circle cy="-48" r="28" fill="#e8efe6" fill-opacity="0.55"/>
      <path d="M-48 20c12-42 30-62 48-62s36 20 48 62" stroke="#e8efe6" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.55"/>
    </g>
    <g>
      <circle cy="-70" r="34" fill="#e8efe6" fill-opacity="0.92"/>
      <path d="M-58 12c14-50 36-74 58-74s44 24 58 74" stroke="#e8efe6" stroke-width="14" stroke-linecap="round" fill="none"/>
    </g>
    <g transform="translate(160 -20)">
      <circle cy="-48" r="28" fill="#e8efe6" fill-opacity="0.55"/>
      <path d="M-48 20c12-42 30-62 48-62s36 20 48 62" stroke="#e8efe6" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.55"/>
    </g>
  </g>

  <!-- shared cost bar -->
  <g transform="translate(160 720)">
    <rect width="580" height="160" rx="4" fill="#2a5f58" fill-opacity="0.35"/>
    <rect x="28" y="40" width="200" height="14" rx="2" fill="#e8efe6" fill-opacity="0.55"/>
    <rect x="28" y="72" width="320" height="10" rx="2" fill="#e8efe6" fill-opacity="0.22"/>
    <g transform="translate(28 112)">
      <rect width="120" height="22" rx="2" fill="#c4964a"/>
      <rect x="136" width="90" height="22" rx="2" fill="#e8efe6" fill-opacity="0.18"/>
      <rect x="242" width="90" height="22" rx="2" fill="#e8efe6" fill-opacity="0.18"/>
      <rect x="348" width="90" height="22" rx="2" fill="#e8efe6" fill-opacity="0.18"/>
    </g>
  </g>

  <circle cx="760" cy="220" r="9" fill="#c4964a" opacity="0.8"/>
  <circle cx="140" cy="260" r="6" fill="#e8efe6" opacity="0.25"/>
</svg>
