<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" fill="none" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dce4d8"/>
      <stop offset="100%" stop-color="#b8c7b4"/>
    </linearGradient>
    <linearGradient id="tc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a5f58"/>
      <stop offset="100%" stop-color="#1e4641"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1100" fill="url(#tg)"/>

  <!-- soft field rings -->
  <circle cx="520" cy="480" r="280" stroke="#2a5f58" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="520" cy="480" r="190" stroke="#2a5f58" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="520" cy="480" r="110" stroke="#2a5f58" stroke-opacity="0.18" stroke-width="2.5"/>

  <!-- map pin -->
  <g transform="translate(470 250)">
    <path d="M50 0c38 0 70 30 70 68 0 52-70 132-70 132S-20 120-20 68C-20 30 12 0 50 0z" fill="url(#tc)"/>
    <circle cx="50" cy="68" r="24" fill="#e8efe6"/>
    <circle cx="50" cy="68" r="10" fill="#c4964a"/>
  </g>

  <!-- request card -->
  <g transform="translate(120 640)">
    <rect width="520" height="280" rx="4" fill="#f4f6f1" fill-opacity="0.92"/>
    <rect x="36" y="48" width="72" height="72" rx="36" fill="#2a5f58"/>
    <path d="M54 88c6-14 14-20 18-20s12 6 18 20" stroke="#f4f6f1" stroke-width="4" stroke-linecap="round"/>
    <circle cx="72" cy="68" r="8" fill="#f4f6f1"/>
    <rect x="132" y="58" width="220" height="14" rx="2" fill="#2a5f58" fill-opacity="0.55"/>
    <rect x="132" y="88" width="160" height="10" rx="2" fill="#2a5f58" fill-opacity="0.22"/>
    <rect x="36" y="160" width="448" height="8" rx="2" fill="#2a5f58" fill-opacity="0.12"/>
    <rect x="36" y="184" width="380" height="8" rx="2" fill="#2a5f58" fill-opacity="0.1"/>
    <rect x="36" y="208" width="300" height="8" rx="2" fill="#2a5f58" fill-opacity="0.08"/>
    <rect x="36" y="236" width="140" height="28" rx="2" fill="#c4964a"/>
  </g>

  <!-- orbit dots -->
  <circle cx="720" cy="320" r="8" fill="#c4964a" opacity="0.85"/>
  <circle cx="760" cy="520" r="6" fill="#2a5f58" opacity="0.35"/>
  <circle cx="180" cy="360" r="5" fill="#2a5f58" opacity="0.25"/>
