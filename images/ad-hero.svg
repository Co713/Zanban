<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f4a42"/>
      <stop offset="55%" stop-color="#3d5c52"/>
      <stop offset="100%" stop-color="#6a8174"/>
    </linearGradient>
    <linearGradient id="hg2" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#c4964a" stop-opacity="0.35"/>
